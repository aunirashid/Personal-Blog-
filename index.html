<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Personal Blog</title>

  <link rel="stylesheet" href="css/style.css">

  <!-- GOOGLE FONTS -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

</head>
<body class="home-page">

  <main class="home-container">

    <div class="diary-card" id="diaryCard">

      <p class="small-text">PERSONAL BLOG</p>

      <h1>
        Hello, I'm
        <span>Auni Hazirah</span>
      </h1>

      <p class="intro">
        Welcome to my portfolio space where I share about myself,
        and my journey.
      </p>

      <button class="enter-btn" onclick="openDiary()">
        Enter About Me ♡
      </button>

    </div>

  </main>

  <!-- MUSIC -->
  <audio id="bgMusic">
    <source src="music/song.mp3" type="audio/mp3">
  </audio>

  <!-- MUSIC BUTTON -->
  <div class="music-player" onclick="toggleMusic()">
    <span id="musicText">🎧 Soft Music</span>
  </div>

  <script src="js/script.js"></script>

</body>
</html>
